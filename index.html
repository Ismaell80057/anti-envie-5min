<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minuteur 13h40</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       background:#111;color:#fff;font-family:system-ui,sans-serif;text-align:center}
  #t{font-size:clamp(3rem,18vw,10rem);font-variant-numeric:tabular-nums;font-weight:700}
  p{opacity:.6;font-size:1.2rem}
  .fin{color:#4ade80}
</style>
</head>
<body>
<p>Jusqu'à 13h40</p>
<div id="t">--:--:--</div>
<script>
  const el = document.getElementById('t');
  const cible = new Date(); cible.setHours(13, 40, 0, 0);
  const pad = n => String(n).padStart(2, '0');
  function tick() {
    const ms = cible - new Date();
    if (ms <= 0) { el.textContent = "C'est l'heure !"; el.className = 'fin'; document.title = "13h40 !"; return; }
    const s = Math.ceil(ms / 1000);
    const txt = pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60);
    el.textContent = txt; document.title = txt;
    setTimeout(tick, 1000 - (Date.now() % 1000));
  }
  tick();
</script>
</body>
</html>
